name: AI experiment（比較・本番に影響なし）

# AI予測モデルの設計を比べるだけ。サイトの更新（pages.yml）とは別に動き、本番のモデルやデータは変えない
on:
  workflow_dispatch:
    inputs:
      exp_set:
        description: '比較する設計の組（base / us / sector / adapt / rank / fins / long / blend）'
        default: 'adapt'
      horizon:
        description: '何営業日後（5 or 20）'
        default: '5'
      long:
        description: '8年分の日足とEDINETの決算で比べる（exp_set=long のとき）'
        type: boolean
        default: false

permissions:
  contents: write  # 比較結果を experiments ブランチに保存（サイトの成績タブに出す）

concurrency:
  group: kabu-radar-experiment
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - name: 日足キャッシュを読む（書き戻さない）
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: hist-none
          restore-keys: hist-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 比較
        id: exp
        env:
          EXP_SET: ${{ inputs.exp_set }}
        run: |
          pip install --quiet -r requirements.txt 2>&1 | tail -3
          mkdir -p exp/raw exp/cache
          git fetch -q --depth 1 origin data && git show origin/data:universe.json > exp/raw/universe.json
          EXTRA=""
          if [ "${{ inputs.long }}" = "true" ]; then
            git show origin/data:screener.json | python -c "import json,sys;[print(r['sym']) for r in json.load(sys.stdin)['rows'] if r.get('liquid')]" > codes.txt
            python scripts/fetch_long_history.py --codes codes.txt --years 8 --out exp/raw/history.json
            git fetch -q --depth 1 origin edinet 2>/dev/null && mkdir -p exp/edinet && git archive origin/edinet | tar -x -C exp/edinet || true
            EXTRA="--edinet exp/edinet"
          else
            python -c "import gzip,json;d=json.load(gzip.open('cache/history.json.gz','rt'));json.dump(d['bars'],open('exp/raw/history.json','w'));print(len(d['bars']),'銘柄')"
          fi
          echo '{}' > exp/raw/market.json
          # ドル円（新しい入力「ドル円への感応度」用。取れなければ空のまま）
          python - <<'PY' || echo '{}' > exp/raw/us.json
          import json, yfinance as yf
          s = yf.download("JPY=X", period="10y", interval="1d", auto_adjust=True, progress=False)["Close"].squeeze().dropna()
          json.dump({"USDJPY": {"d": [d.strftime("%Y-%m-%d") for d in s.index], "c": [float(x) for x in s.values]}}, open("exp/raw/us.json", "w"))
          print("USDJPY", len(s))
          PY
          git fetch -q --depth 1 origin fins 2>/dev/null && mkdir -p exp/fins && git archive origin/fins | tar -x -C exp/fins || true
          git fetch -q --depth 1 origin tdnet 2>/dev/null && mkdir -p exp/tdnet && git archive origin/tdnet | tar -x -C exp/tdnet || true
          set +e
          python -W ignore scripts/model.py --history exp/raw/history.json --universe exp/raw/universe.json --market exp/raw/market.json \
            --cache exp/cache --out exp/raw --train --no-eval --experiment --horizon ${{ inputs.horizon }} --fins exp/fins --tdnet exp/tdnet $EXTRA > exp.log 2>&1
          code=$?
          (grep "^EXP " exp.log || true) | while read -r line; do echo "::notice title=比較（${{ inputs.horizon }}日）::$line"; done
          if [ $code -ne 0 ]; then echo "::error title=失敗（$code）::$(tail -c 1500 exp.log | tr '\n' '|')"; free -m | tr '\n' '|'; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: 結果を experiments ブランチに保存
        if: steps.exp.outputs.code == '0'
        run: |
          git clone -q --depth 1 -b experiments "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" expb 2>/dev/null \
            || (mkdir expb && cd expb && git init -q -b experiments)
          name="${{ inputs.exp_set }}_${{ inputs.horizon }}${{ inputs.long && '_long' || '' }}"
          python - "$name" <<'PY'
          import json, sys, datetime, glob
          name = sys.argv[1]
          res = json.load(open(glob.glob("exp/raw/experiments*.json")[0]))
          doc = {"set": name, "runAt": datetime.datetime.utcnow().isoformat() + "Z", "results": res}
          json.dump(doc, open(f"expb/{name}.json", "w"), ensure_ascii=False)
          PY
          cd expb
          git add -A
          git -c user.name="kabu-radar-bot" -c user.email="actions@users.noreply.github.com" commit -qm "experiment $name" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:experiments
