name: Update data & Deploy

# 東証の全上場銘柄の株価取得 → 判定・バックテスト・ペーパートレード更新 → GitHub Pages へ公開
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_daily:
        description: '日足1年分・決算予定日・財務・ニュースを今すぐ取り直す'
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 0-6 * * 1-5'  # 東証の取引時間（JST 9:07〜15:52、15分おき）
    - cron: '3 22 * * 0-4'            # 平日の朝 JST 7:03（全件取り直し・決算予定日・財務・ニュース）

permissions:
  contents: write   # data ブランチへの保存
  pages: write
  id-token: write
  models: read      # GitHub Models（無料のAI解説）

concurrency:
  group: kabu-radar-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: 前回の状態（data ブランチ）を取得
        run: |
          git clone --depth 1 -b data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prev \
            || mkdir -p prev

      - name: 日足キャッシュを復元
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: テスト
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 株価・決算予定日・財務・ニュースを取得
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          pip install --quiet yfinance pandas xlrd openpyxl 2>&1 | tail -3
          python scripts/fetch_data.py --prev prev --cache cache --out raw ${{ inputs.force_daily && '--force-daily' || '' }} 2>&1 | tee fetch.log
          echo "::notice title=取得結果::$(tail -n 1 fetch.log)"

      - name: 取得エラーの内容を表示
        if: steps.fetch.outcome != 'success'
        run: echo "::error title=取得エラー::$(tail -c 1500 fetch.log 2>/dev/null | tr '\n' '|')"

      - name: 日足キャッシュを保存
        if: steps.fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}

      - name: 判定・バックテスト・ペーパートレード・解説を生成
        if: steps.fetch.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build_data.mjs --raw raw --prev prev --out data

      - name: 状態を data ブランチに保存（日足は含めない・最新1コミットのみ）
        if: steps.fetch.outcome == 'success'
        run: |
          mkdir -p state
          for f in paper ai notified events news fundamentals universe screener meta backtest review market; do
            [ -f "data/$f.json" ] && cp "data/$f.json" state/
          done
          cd state
          git init -q -b data
          git add -A
          git -c user.name="kabu-radar-bot" -c user.email="actions@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data

      - name: 取得に失敗したら公開を見送る
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::warning::データ取得に失敗したため、今回は公開を更新しません"
          exit 1

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          cp -r data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
