name: Update data & Deploy

# 東証の全上場銘柄の株価取得 → 判定・バックテスト・ペーパートレード更新 → GitHub Pages へ公開
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_daily:
        description: '日足3年分・決算予定日・財務・ニュースを今すぐ取り直し、AIを学習し直す'
        type: boolean
        default: false
      experiment:
        description: 'AI予測モデルの設計を比較する（時間がかかります）'
        type: boolean
        default: false
      exp_set:
        description: '比較する設計の組（base＝従来の4種 / us＝前の晩の米国市場）'
        default: 'base'
  schedule:
    - cron: '17,47 0-6 * * 1-5'       # 予備（ふだんは live.yml が取引中10分ごとに起動する）
    - cron: '3 21 * * 0-4'            # 平日の朝 JST 6:03（3年分の取り直し・AI予測モデルの学習・決算予定日・財務・ニュース）

permissions:
  contents: write   # data ブランチへの保存
  pages: write
  id-token: write
  models: read      # GitHub Models（無料のAI解説）

concurrency:
  group: kabu-radar-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 前回の状態（data ブランチ）を取得
        run: |
          git clone --depth 1 -b data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prev \
            || mkdir -p prev

      - name: 日足キャッシュを復元
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: テスト
        run: npm test

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 株価・決算予定日・財務・ニュースを取得
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          pip install --quiet -r requirements.txt 2>&1 | tail -3
          git fetch -q --depth 1 origin live 2>/dev/null && git show origin/live:live.json > live.json 2>/dev/null || echo '{}' > live.json
          python scripts/fetch_data.py --prev prev --cache cache --out raw --live live.json ${{ inputs.force_daily && '--force-daily' || '' }} 2>&1 | tee fetch.log
          echo "::notice title=取得結果::$(tail -n 1 fetch.log)"

      - name: 取得エラーの内容を表示
        if: steps.fetch.outcome != 'success'
        run: echo "::error title=取得エラー::$(tail -c 1500 fetch.log 2>/dev/null | tr '\n' '|')"

      - name: AI予測（朝は学習と検証も）
        id: model
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          MODEL_VARIANT: ${{ vars.MODEL_VARIANT || 'B_no_market' }}
          EXP_SET: ${{ inputs.exp_set || 'base' }}
        run: |
          set -o pipefail
          TRAIN=$(python -c "import json;m=json.load(open('raw/fetch_meta.json'));print('--train' if m['history']['mode']=='full' else '')")
          EXP=${{ inputs.experiment && '--experiment' || '' }}
          python scripts/model.py --history raw/history.json --universe raw/universe.json --market raw/market.json --cache cache --out raw $TRAIN $EXP 2>&1 | tee model.log
          (grep "^EXP " model.log || true) | while read -r line; do echo "::notice title=設計の比較::$line"; done
          echo "::notice title=AI予測::$(tail -n 1 model.log)"

      - name: 1か月先のAI予測（朝は学習と検証、日中は全銘柄を取り直した回だけ予測）
        id: model20
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          MODEL_VARIANT: ${{ vars.MODEL_VARIANT || 'B_no_market' }}
        run: |
          set -o pipefail
          read MODE TIER <<< "$(python -c "import json;m=json.load(open('raw/fetch_meta.json'))['history'];print(m['mode'],m['tier'])")"
          if [ "$MODE" = "full" ]; then ARGS=--train; elif [ "$TIER" = "active" ]; then echo "今回は省略"; exit 0; else ARGS=; fi
          python scripts/model.py --history raw/history.json --universe raw/universe.json --market raw/market.json --cache cache --out raw --horizon 20 --tag 20 $ARGS 2>&1 | tee model20.log
          echo "::notice title=1か月予測::$(tail -n 1 model20.log)"

      - name: AI予測のエラーを表示
        if: steps.model.outcome == 'failure'
        run: echo "::warning title=AI予測エラー::$(tail -c 1500 model.log 2>/dev/null | tr '\n' '|')"

      - name: キャッシュを保存するか（全銘柄を取り直した回か、AIを学習し直した回だけ）
        id: tier
        if: steps.fetch.outcome == 'success'
        run: echo "save=$(python -c "import json,os;m=json.load(open('raw/fetch_meta.json'));print('yes' if m['history']['tier']!='active' or os.path.exists('raw/model_trained') else 'no')")" >> "$GITHUB_OUTPUT"

      - name: 日足キャッシュを保存
        if: steps.fetch.outcome == 'success' && steps.tier.outputs.save == 'yes'
        uses: actions/cache/save@v5
        with:
          path: cache
          key: hist-${{ github.run_id }}

      - name: 判定・バックテスト・ペーパートレード・解説を生成
        if: steps.fetch.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build_data.mjs --raw raw --prev prev --out data

      - name: 適時開示（TDnet）を書き出す
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin tdnet && mkdir -p tdnet && git archive origin/tdnet | tar -x -C tdnet \
            && python scripts/tdnet.py --repo tdnet --export data/tdnet.json --since-days 45

      - name: 状態を data ブランチに保存（日足は含めない・最新1コミットのみ）
        if: steps.fetch.outcome == 'success'
        run: |
          mkdir -p state
          for f in paper paper_ai ai ai_log ai_track notified events news fundamentals universe screener meta backtest review market model model20 dividends; do
            [ -f "data/$f.json" ] && cp "data/$f.json" state/
          done
          cd state
          git init -q -b data
          git add -A
          git -c user.name="kabu-radar-bot" -c user.email="actions@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data

      - name: 取得に失敗したら公開を見送る
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::warning::データ取得に失敗したため、今回は公開を更新しません"
          exit 1

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          cp -r data _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
