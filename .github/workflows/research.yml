name: Research（調査用）

# scripts/research/ の調査スクリプトを手動で実行し、結果（JSON）を成果物として残す。サイトの更新とは無関係
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'scripts/research/ のファイル名（.py なし）'
        default: 'cycles'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 実行
        run: |
          set -o pipefail
          pip install --quiet -r requirements.txt 2>&1 | tail -3
          python -W ignore scripts/research/${{ inputs.script }}.py --out result.json 2>&1 | tee run.log
          grep -E "^(SUMMARY|AUTOCORR)" run.log | while read -r l; do echo "::notice title=結果::$l"; done
      - uses: actions/upload-artifact@v5
        with:
          name: research-${{ inputs.script }}
          path: result.json
