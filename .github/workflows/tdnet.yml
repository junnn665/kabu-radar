name: TDnet 適時開示の収集

# 東証の適時開示を毎日集めて tdnet ブランチに貯める（TDnet は過去約1か月分しか見られないため）
on:
  workflow_dispatch:
    inputs:
      days:
        description: '何日さかのぼって取得するか（初回は31）'
        default: '3'
  schedule:
    - cron: '40 10 * * 1-5'   # JST 19:40（平日。開示は15時〜17時台に多い）
    - cron: '50 22 * * 0-4'   # JST 7:50（前日の夜の分）

permissions:
  contents: write

concurrency:
  group: kabu-radar-tdnet
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 取得
        run: |
          git clone -q --depth 1 -b tdnet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tdnet 2>/dev/null \
            || (mkdir tdnet && cd tdnet && git init -q -b tdnet)
          python scripts/tdnet.py --repo tdnet --days ${{ inputs.days || '3' }} 2>&1 | tee tdnet.log
          echo "::notice title=TDnet::$(tail -n 1 tdnet.log)"
      - name: 保存
        run: |
          cd tdnet
          git add -A
          git -c user.name="kabu-radar-bot" -c user.email="actions@users.noreply.github.com" commit -qm "tdnet $(date -u +%FT%TZ)" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:tdnet
